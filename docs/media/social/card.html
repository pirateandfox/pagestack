<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #f7f6f2; font-family: "IBM Plex Sans", sans-serif; color: #1c1d21; position: relative; }
  .glow { position: absolute; right: -180px; top: -160px; width: 900px; height: 900px; border-radius: 50%;
          background: radial-gradient(circle, rgba(37,99,235,.16), rgba(37,99,235,0) 62%); }
  .left { position: absolute; left: 80px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .lockup svg { width: 76px; height: 76px; }
  .lockup span { font: 800 64px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.025em; }
  h1 { margin: 0; font: 700 42px/1.12 "Bricolage Grotesque", sans-serif; letter-spacing: -.015em; text-wrap: balance; }
  h1 em { font-style: normal; color: #2563eb; }
  p { margin: 0; font-size: 22px; line-height: 1.45; color: #55575f; max-width: 30ch; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chips span { font: 500 15px/1 "IBM Plex Mono", monospace; padding: 9px 13px; border-radius: 999px; background: #fff; border: 1px solid #e2e1db; color: #3c3e45; }
  .shot { position: absolute; left: 660px; top: 104px; width: 720px; border-radius: 14px; overflow: hidden;
          box-shadow: 0 30px 70px rgba(20,24,40,.22), 0 6px 18px rgba(20,24,40,.12); border: 1px solid #dcdbd4; background: #fff; }
  .bar { height: 30px; background: #ecebe6; display: flex; align-items: center; gap: 7px; padding-left: 14px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #d3d2cb; }
  .shot img { display: block; width: 720px; height: auto; }
  .imgwrap { height: 392px; overflow: hidden; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="lockup">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="6" y="30" width="40" height="26" rx="6" fill="#1e1e1e" opacity=".22"/>
        <rect x="12" y="20" width="40" height="26" rx="6" fill="#1e1e1e" opacity=".5"/>
        <rect x="18" y="8" width="40" height="28" rx="6" fill="#2563eb"/>
        <rect x="25" y="16" width="18" height="3.5" rx="1.75" fill="#fff"/>
        <rect x="25" y="23.5" width="26" height="3.5" rx="1.75" fill="#fff" opacity=".7"/>
      </svg>
      <span>PageStack</span>
    </div>
    <h1>A block editor for Astro. <em>Your content stays in your repo.</em></h1>
    <p>Click any section to edit it in place. Saves go straight to your git repo, and the public site stays static.</p>
    <div class="chips"><span>Astro</span><span>Git-based</span><span>Self-hosted</span><span>MIT</span></div>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><div class="imgwrap"><img src="editor-frame.png"></div></div>
</body></html>
